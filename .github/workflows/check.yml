name: Validate foundation
on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'preview']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and tests
        run: npm run check
      - name: Validate iOS release configuration
        run: npm run test:release
      - name: Check Expo package consistency
        run: npx expo install --check
        working-directory: apps/app
      - name: Export web
        run: npm run build:web
      - name: Validate Worker deployment bundle
        run: npm run build -w @sparqfire/worker
      - name: Export iOS embedded bundle
        run: npx expo export --platform ios
        working-directory: apps/app
